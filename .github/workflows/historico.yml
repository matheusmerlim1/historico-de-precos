name: Histórico de preço

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historico
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Conferir todos os produtos da lista
        run: node --experimental-strip-types --no-warnings robo/atualizar.ts --todos --minutos 20

      - name: Salvar os dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: histórico de preço atualizado"
          for tentativa in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done
