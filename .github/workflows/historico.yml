name: Histórico de preço

on:
  issues:
    types: [opened]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: historico
  cancel-in-progress: false

jobs:
  atualizar:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'Histórico')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Atender o pedido aberto como issue
        if: github.event_name == 'issues'
        env:
          TITULO: ${{ github.event.issue.title }}
          CORPO: ${{ github.event.issue.body }}
        run: |
          printf '%s\n%s\n' "$TITULO" "$CORPO" > "$RUNNER_TEMP/pedido.txt"
          node --experimental-strip-types --no-warnings robo/atualizar.ts --pedido "$RUNNER_TEMP/pedido.txt" --resposta "$RUNNER_TEMP/resposta.md"

      - name: Conferir todos os produtos
        if: github.event_name != 'issues'
        run: node --experimental-strip-types --no-warnings robo/atualizar.ts --todos --minutos 20

      - name: Salvar os dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: histórico de preço atualizado"
          for tentativa in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done

      - name: Responder o pedido
        if: github.event_name == 'issues' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.issue.number }}
        run: |
          if [ ! -s "$RUNNER_TEMP/resposta.md" ]; then
            echo "O robô não conseguiu terminar este pedido. Tente abrir outro mais tarde." > "$RUNNER_TEMP/resposta.md"
          fi
          gh issue comment "$NUMERO" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/resposta.md"
          gh issue close "$NUMERO" --repo "$GITHUB_REPOSITORY"
